name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache SFML
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: sfml-2.6.1-${{ runner.os }}

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release